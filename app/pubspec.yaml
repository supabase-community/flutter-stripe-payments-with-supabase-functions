name: stripe_payments
description: An example app that accepts payments with Stripe and Supabase Edge Functions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_stripe: ^14.1.0
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
